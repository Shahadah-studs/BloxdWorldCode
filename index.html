        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Press Start 2P', monospace;
                image-rendering: pixelated;
            }

            body {
                background: linear-gradient(135deg, #040c06, #0b1f10, #040c06);
                background-size: 400% 400%;
                animation: gradientBG 15s ease infinite;
                color: #fff;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
                overflow: hidden;
                position: relative;
                padding: 40px 20px;
            }

            @keyframes gradientBG {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }

            .bg-animation {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                pointer-events: none;
            }

            .square {
                position: absolute;
                background: transparent;
                animation: fall linear infinite;
                bottom: 100%;
            }

            .square:nth-child(1) { left: 8%; width: 40px; height: 40px; border: 4px solid #39ff14; box-shadow: 0 0 15px #39ff14; animation-duration: 8s; }
            .square:nth-child(2) { left: 25%; width: 20px; height: 20px; border: 4px solid #00ffff; box-shadow: 0 0 10px #00ffff; animation-duration: 5s; animation-delay: 2s; }
            .square:nth-child(3) { left: 75%; width: 50px; height: 50px; border: 5px solid #39ff14; box-shadow: 0 0 18px #39ff14; animation-duration: 10s; animation-delay: 3s; }
            .square:nth-child(4) { left: 90%; width: 25px; height: 25px; border: 4px solid #00ffff; box-shadow: 0 0 10px #00ffff; animation-duration: 6s; animation-delay: 0.5s; }

            @keyframes fall {
                0% { transform: translateY(-10%) rotate(0deg); opacity: 0; }
                10%, 90% { opacity: 0.3; }
                100% { transform: translateY(115vh) rotate(360deg); opacity: 0; }
            }

            .nav-container {
                position: absolute;
                top: 30px;
                left: 30px;
                z-index: 10;
            }

            .dropdown {
                position: relative;
                display: inline-block;
                padding-bottom: 20px; /* Invisible hover bridge box */
            }

            .dropbtn {
                background-color: #0b1f10;
                color: #39ff14;
                border: 4px solid #39ff14;
                padding: 14px 20px;
                font-size: 0.8rem;
                cursor: pointer;
                box-shadow: 4px 4px 0px #000;
                transition: transform 0.1s, box-shadow 0.1s;
            }

            .dropdown:hover .dropbtn {
                background-color: #39ff14;
                color: #000;
                box-shadow: 2px 2px 0px #000;
                transform: translate(2px, 2px);
            }

            .dropdown-content {
                display: none;
                position: absolute;
                top: 55px; /* Tightly attached directly under button */
                left: 0;
                background-color: rgba(4, 12, 6, 0.95);
                min-width: 320px;
                border: 6px solid #10b981;
                box-shadow: 0 0 25px #10b981, 6px 6px 0px #000;
                outline: 6px solid #4ade80;
                padding: 10px;
            }

            .dropdown:hover .dropdown-content {
                display: block;
                animation: menuFade 0.2s ease-out;
            }

            @keyframes menuFade {
                0% { opacity: 0; transform: translateY(-5px); }
                100% { opacity: 1; transform: translateY(0); }
            }

            .dropdown-content a {
                color: #00ffff;
                padding: 14px;
                text-decoration: none;
                display: block;
                font-size: 0.75rem;
                border-bottom: 4px dashed #10b981;
                text-align: left;
            }

            .dropdown-content a:last-child {
                border-bottom: none;
            }

            .dropdown-content a:hover {
                background-color: #00ffff;
                color: #000;
                text-shadow: none;
            }

            .center-wrap {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                flex-grow: 1;
                z-index: 2;
                max-width: 800px;
            }

            h1 {
                font-size: 3rem;
                color: #a6ff00;
                text-shadow: 0 0 20px #39ff14;
                margin-bottom: 40px;
                letter-spacing: -2px;
                text-align: center;
            }

            .enter-btn {
                display: inline-block;
                background-color: #0b1f10;
                color: #ffff00;
                border: 6px solid #ffff00;
                padding: 24px 44px;
                font-size: 1.4rem;
                text-decoration: none;
                box-shadow: 6px 6px 0px #000;
                transition: transform 0.1s, box-shadow 0.1s;
                animation: pulseButton 1.5s infinite alternate;
            }

            .enter-btn:hover {
                background-color: #ffff00;
                color: #000;
                box-shadow: 3px 3px 0px #000;
                transform: translate(3px, 3px);
                animation-play-state: paused;
            }

            @keyframes pulseButton {
                0% { box-shadow: 4px 4px 0px #000, 0 0 10px rgba(255, 255, 0, 0.4); }
                100% { box-shadow: 8px 8px 0px #000, 0 0 25px #ffff00; }
            }

            .welcome-info {
                margin-top: 40px;
                font-size: 0.75rem;
                color: #39ff14;
                text-shadow: 0 0 8px #10b981;
                line-height: 2;

                width: 100%;
