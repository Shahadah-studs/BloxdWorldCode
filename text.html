<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png?v=final">
    <title>Bloxd.io Client Console // Shahadah Studios Elite</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; image-rendering: pixelated; }
        html, body { width: 100%; height: 100%; background-color: #000; overflow: hidden; position: relative; }
        
        /* Fixed top bar configuration limits layout reflow loops */
        .client-header { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px; 
            background: linear-gradient(135deg, #040c06, #0b1f10);
            border-bottom: 6px solid #10b981; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
        }
        
        .nav-container { position: relative; }
        .dropdown { position: relative; display: inline-block; padding-bottom: 25px; }
        
        .dropbtn { 
            background-color: #0b1f10; 
            color: #39ff14; 
            border: 4px solid #39ff14; 
            padding: 10px 16px; 
            font-size: 0.75rem; 
            cursor: pointer; 
            box-shadow: 4px 4px 0px #000; 
            transition: transform 0.1s, box-shadow 0.1s; 
        }
        
        .dropdown:hover .dropbtn { 
            background-color: #39ff14; 
            color: #000; 
            box-shadow: 2px 2px 0px #000; 
            transform: translate(2px, 2px); 
        }
        
        .dropdown-content { 
            display: none; 
            position: absolute; 
            top: 45px; 
            left: 0; 
            background-color: #040c06; 
            min-width: 260px; 
            border: 6px solid #10b981; 
            box-shadow: 0 0 25px #10b981, 6px 6px 0px #000; 
            outline: 6px solid #4ade80; 
            padding: 8px; 
            z-index: 99999; 
        }
        
        .dropdown:hover .dropdown-content { display: block; }
        
        .dropdown-content a { 
            color: #00ffff; 
            padding: 12px; 
            text-decoration: none; 
            display: block; 
            font-size: 0.7rem; 
            border-bottom: 4px dashed #10b981; 
            text-align: left; 
        }
        
        .dropdown-content a:last-child { border-bottom: none; }
        
        .dropdown-content a:hover { 
            background-color: #00ffff; 
            color: #000; 
            text-shadow: none; 
        }
        
        .client-status { 
            color: #ffff00; 
            font-size: 0.75rem; 
            text-shadow: 0 0 8px #ffff00; 
            letter-spacing: -1px; 
        }
        
        /* Hardware accelerated layout container isolates the main iframe window element */
        .game-viewport { 
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%; 
            height: calc(100% - 60px);
            padding: 15px; 
            background-color: #020503;
            will-change: transform;
        }
        
        .iframe-container { 
            width: 100%; 
            height: 100%; 
            border: 6px solid #10b981; 
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); 
            outline: 6px solid #4ade80; 
            background-color: #000; 
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
        }
    </style>
</head>
<body>

    <div class="client-header">
        <nav class="nav-container">
            <div class="dropdown">
                <button class="dropbtn">LAUNCHER MENU ▼</button>
                <div class="dropdown-content">
                    <a href="index.html">Back to Homepage</a>
                    <a href="api.html">Bloxd.io API's</a>
                </div>
            </div>
        </nav>
        <div class="client-status">> SHS ELITE COMPILER // LITE_MODE ACTIVE</div>
    </div>

    <div class="game-viewport">
        <div class="iframe-container">
            <iframe 
                src="https://bloxd.io" 
                allow="fullscreen; keyboard; gamepad"
                scrolling="no"
                title="Bloxd.io Fullscreen Engine">
            </iframe>
        </div>
    </div>

    <script src="https://google.com"></script>
    <script>
        grecaptcha.ready(function() {
            grecaptcha.execute('YOUR_GOOGLE_SITE_KEY', {action: 'homepage'}).then(function(token) {
                console.log("SHS Elite Security: Client Engine Secured.");
            });
        });
    </script>

</body>
</html>
