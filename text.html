<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png?v=final">
    <title>Bloxd.io Client Console // Shahadah Studios Elite</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; image-rendering: pixelated; }
        html, body { width: 100%; height: 100%; background-color: #040c06; color: #fff; overflow: hidden; position: relative; }
        .bg-animation { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .square { position: absolute; background: transparent; animation: fall linear infinite; bottom: 100%; }
        .square:nth-child(1) { left: 6%; width: 40px; height: 40px; border: 4px solid #39ff14; box-shadow: 0 0 15px #39ff14; animation-duration: 8s; }
        .square:nth-child(2) { left: 20%; width: 20px; height: 20px; border: 4px solid #00ffff; box-shadow: 0 0 10px #00ffff; animation-duration: 5s; animation-delay: 2s; }
        .square:nth-child(3) { left: 80%; width: 50px; height: 50px; border: 5px solid #39ff14; box-shadow: 0 0 18px #39ff14; animation-duration: 10s; animation-delay: 3s; }
        .square:nth-child(4) { left: 92%; width: 25px; height: 25px; border: 4px solid #00ffff; box-shadow: 0 0 10px #00ffff; animation-duration: 6s; animation-delay: 0.5s; }
        @keyframes fall { 0% { transform: translateY(-10%) rotate(0deg); opacity: 0; } 10%, 90% { opacity: 0.35; } 100% { transform: translateY(115vh) rotate(360deg); opacity: 0; } }
        .launcher-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 2; background: linear-gradient(135deg, rgba(4,12,6,0.85), rgba(11,31,16,0.85)); }
        .client-header { width: 100%; height: 60px; background-color: #0b1f10; border-bottom: 6px solid #10b981; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; box-shadow: 0 0 20px #10b981; }
        .nav-container { position: relative; }
        .dropdown { position: relative; display: inline-block; padding-bottom: 20px; }
        .dropbtn { background-color: #0b1f10; color: #39ff14; border: 4px solid #39ff14; padding: 10px 16px; font-size: 0.75rem; cursor: pointer; box-shadow: 4px 4px 0px #000; transition: transform 0.1s, box-shadow 0.1s; }
        .dropdown:hover .dropbtn { background-color: #39ff14; color: #000; box-shadow: 2px 2px 0px #000; transform: translate(2px, 2px); }
        .dropdown-content { display: none; position: absolute; top: 45px; left: 0; background-color: rgba(4, 12, 6, 0.98); min-width: 260px; border: 6px solid #10b981; box-shadow: 0 0 25px #10b981, 6px 6px 0px #000; outline: 6px solid #4ade80; padding: 8px; z-index: 99999; }
        .dropdown:hover .dropdown-content { display: block; animation: menuFade 0.2s ease-out; }
        @keyframes menuFade { 0% { opacity: 0; transform: translateY(-5px); } 100% { opacity: 1; transform: translateY(0); } }
        .dropdown-content a { color: #00ffff; padding: 12px; text-decoration: none; display: block; font-size: 0.7rem; border-bottom: 4px dashed #10b981; text-align: left; }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #00ffff; color: #000; text-shadow: none; }
        .client-status { color: #ffff00; font-size: 0.8rem; text-shadow: 0 0 8px #ffff00; letter-spacing: -1px; }
        .game-viewport { flex-grow: 1; width: 100%; position: relative; padding: 25px; display: flex; justify-content: center; align-items: center; }
        .iframe-container { width: 100%; height: 100%; border: 8px solid #10b981; box-shadow: 0 0 30px #10b981; outline: 8px solid #4ade80; background-color: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <div class="bg-animation">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
    </div>

    <div class="launcher-panel">
        <div class="client-header">
            <nav class="nav-container">
                <div class="dropdown">
                    <button class="dropbtn">LAUNCHER MENU ▼</button>
                    <div class="dropdown-content">
                        <a href="index.html">Back to Homepage</a>
                        <a href="api.html">Bloxd.io API's</a>
                    </div>
                </div>
            </nav>
            <div class="client-status">> SHS ELITE LAUNCHER COMPILER // LIVE_MATRIX</div>
        </div>

        <div class="game-viewport">
            <div class="iframe-container">
                <iframe 
                    src="https://bloxd.io" 
                    allow="fullscreen; keyboard; gamepad"
                    scrolling="no"
                    title="Bloxd.io Fullscreen Engine">
                </iframe>
            </div>
        </div>
    </div>

    <script src="https://google.com"></script>
    <script>
        grecaptcha.ready(function() {
            grecaptcha.execute('YOUR_GOOGLE_SITE_KEY', {action: 'homepage'}).then(function(token) {
                console.log("SHS Elite Security: Client Node Armored.");
            });
        });
    </script>

</body>
</html>
