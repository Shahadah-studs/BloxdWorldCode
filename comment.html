<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>BloxdWorldCode - Live AI Chat</title>
<link rel="icon" type="image/png" href="/favicon.png?v=final">
<style>
  body { background:#0a0a0a; color:#fff; font-family:sans-serif; padding:15px; margin:0; }
  header { border-bottom:2px solid #222; padding-bottom:15px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
  h1 { margin:0; font-size:24px; letter-spacing:3px; }
  .slogan { color:#00ff00; font-family:monospace; font-size:11px; text-transform:uppercase; margin-top:5px; }
  .btn { background:#222; color:#ffcc00; border:1px solid #ffcc00; padding:8px 16px; font-family:monospace; cursor:pointer; text-transform:uppercase; }
  .btn:hover { background:#ffcc00; color:#0a0a0a; }
  .box { background:#111; border:1px solid #222; padding:15px; margin-bottom:20px; }
  .badge { background:#45f3ff; color:#0b0c10; font-size:10px; font-weight:bold; padding:2px 6px; font-family:monospace; }
  textarea, input { background:#0c0c0c; border:1px solid #333; color:#fff; padding:10px; box-sizing:border-box; margin-bottom:10px; font-family:sans-serif; }
  textarea { width:100%; height:60px; resize:none; }
  .comment-row { font-size:13px; padding:10px 0; border-bottom:1px solid #222; line-height:1.5; }
</style></head><body>
<header>
  <div style="display:flex; align-items:center;"><a href="index.html" class="btn" style="text-decoration:none; margin-right:15px;">[ Back ]</a>
  <div><h1>BLOXDWORLDCODE</h1><div class="slogan">There can be Muslims anywhere - There is a Muslim in the coding industry</div></div></div>
  <div><span class="badge" id="ai-status" style="background:#ffcc00;">REAL AI LIVE</span></div>
</header>
<div style="max-width:800px; margin:0 auto;">
  <div class="box">
    <input type="text" id="username-input" placeholder="Your Bloxd Nametag (e.g., Guest_44)" style="width:100%;" required>
    <textarea id="comment-input" placeholder="Ask the real ChatGPT-style AI anything (code, math, schematics...)" required></textarea>
    <button class="btn" id="send-btn" onclick="sendComment()">Post Comment & Ask AI</button>
  </div>
  <h3 style="font-size:12px; letter-spacing:2px; color:#666; text-transform:uppercase; border-bottom:1px solid #222; padding-bottom:5px;">// Live Public Stream & ChatGPT-Style AI</h3>
  <div id="comments-feed"></div>
</div>
<script>
  function loadComments() {
    var feed = document.getElementById("comments-feed");
    feed.innerHTML = '<div class="comment-row"><b>Shahadah_Studios</b> <span class="badge" style="background:#00ff00;">FOUNDER</span><br><span style="color:#aaa;">Ecosystem update: Connected a real live generative open AI LLM model. Test its intelligence now!</span></div>';
    var saved = localStorage.getItem("bwc_comments");
    if (saved) {
      var list = JSON.parse(saved);
      for (var i = 0; i != list.length; i++) {
        var row = document.createElement("div"); row.className = "comment-row";
        var b = (list[i].name === "SHS_ChatGPT_Bot") ? "background:#ff3333;color:#fff" : "background:#45f3ff;color:#0b0c10";
        row.innerHTML = "<b>" + list[i].name + "</b> <span class='badge' style='" + b + "'>" + (list[i].name === "SHS_ChatGPT_Bot" ? "LIVE AI SYSTEM" : "USER") + "</span><br><span style='color:#aaa;'>" + list[i].text + "</span>";
        feed.insertBefore(row, feed.firstChild);
      }
    }
  }
  function sendComment() {
    var name = document.getElementById("username-input").value.trim(), txt = document.getElementById("comment-input").value.trim();
    if (!name || !txt) return;
    var list = localStorage.getItem("bwc_comments") ? JSON.parse(localStorage.getItem("bwc_comments")) : [];
    list.push({ name: name, text: txt }); localStorage.setItem("bwc_comments", JSON.stringify(list)); loadComments();
    document.getElementById("comment-input").value = ""; document.getElementById("ai-status").innerText = "AI THINKING...";
    
    // Remastered: Adding explicit context rules inside a URL-safe text stream query link
    var customContext = "You are SHS ChatGPT Bot, an elite coding AI assistant inside BloxdWorldCode created by Shahadah Studios Elite. Talk like an intelligent human. Answer this prompt: ";
    var cleanPrompt = encodeURIComponent(customContext + txt);
    
    // Embedded script data-link injector to completely break through Khan Academy sandbox blocks
    var script = document.createElement("script");
    window.pollinationsCallback = function(data) {
      list.push({ name: "SHS_ChatGPT_Bot", text: data.choices[0].text.trim() });
      localStorage.setItem("bwc_comments", JSON.stringify(list));
      document.getElementById("ai-status").innerText = "REAL AI LIVE"; loadComments();
    };
    script.src = "https://pollinations.ai" + cleanPrompt + "?json=true&callback=pollinationsCallback";
    document.body.appendChild(script);
    
    // 3-second safety time execution anchor
    setTimeout(function() { if(document.getElementById("ai-status").innerText === "AI THINKING...") { document.getElementById("ai-status").innerText = "REAL AI LIVE"; } }, 3500);
  }
  loadComments();
</script></body></html>
