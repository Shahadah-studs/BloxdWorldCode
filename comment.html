<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>BloxdWorldCode - Comments</title>
<link rel="icon" type="image/png" href="/favicon.png?v=final">
<style>
  body { background:#0a0a0a; color:#fff; font-family:sans-serif; padding:15px; margin:0; }
  header { border-bottom:2px solid #222; padding-bottom:15px; margin-bottom:20px; }
  h1 { margin:0; font-size:24px; letter-spacing:3px; }
  .slogan { color:#00ff00; font-family:monospace; font-size:11px; text-transform:uppercase; margin-top:5px; }
  .btn { background:#222; color:#ffcc00; border:1px solid #ffcc00; padding:8px 16px; font-family:monospace; cursor:pointer; text-transform:uppercase; }
  .btn:hover { background:#ffcc00; color:#0a0a0a; }
  .box { background:#111; border:1px solid #222; padding:15px; margin-bottom:20px; }
  .badge { background:#45f3ff; color:#0b0c10; font-size:10px; font-weight:bold; padding:2px 6px; font-family:monospace; }
  textarea, input { background:#0c0c0c; border:1px solid #333; color:#fff; padding:10px; box-sizing:border-box; margin-bottom:10px; font-family:sans-serif; }
  textarea { width:100%; height:60px; resize:none; }
  .comment-row { font-size:13px; padding:10px 0; border-bottom:1px solid #222; }
</style></head><body>
<header style="display:flex; justify-content:space-between; align-items:center;">
  <a href="index.html" class="btn" style="text-decoration: none; margin-right: 15px; display: inline-block;">[ Back to Home ]</a>

  <div><h1>BLOXDWORLDCODE</h1><div class="slogan">There can be Muslims anywhere - There is a Muslim in the coding industry</div></div>
  <div><span class="badge" style="background:#ffcc00;">LOCAL RECURSION MODE</span></div>
</header>
<div style="max-width:800px; margin:0 auto;">
  <div class="box">
    <input type="text" id="username-input" placeholder="Your Bloxd Nametag (e.g., Guest_44)" style="width:100%;" required>
    <textarea id="comment-input" placeholder="Type your comment, question, or schematic link here..." required></textarea>
    <button class="btn" onclick="sendComment()">Post Comment</button>
  </div>
  <h3 style="font-size:12px; letter-spacing:2px; color:#666; text-transform:uppercase; border-bottom:1px solid #222; padding-bottom:5px;">// Public Feedback</h3>
  <div id="comments-feed"></div>
</div>
<script>
  // Load existing comments from your Chromebook's browser memory instantly
  function loadComments() {
    var feed = document.getElementById("comments-feed");
    feed.innerHTML = '<div class="comment-row"><b>Shahadah_Studios</b> <span class="badge" style="background:#00ff00;">FOUNDER</span><br><span style="color:#aaa;">Local system live. Drop your BWC feedback here safely.</span></div>';
    var saved = localStorage.getItem("bwc_comments");
    if (saved) {
      var list = JSON.parse(saved);
      for (var i = 0; i != list.length; i++) {
        var row = document.createElement("div");
        row.className = "comment-row";
        row.innerHTML = "<b>" + list[i].name + "</b> <span class='badge'>USER</span><br><span style='color:#aaa;'>" + list[i].text + "</span>";
        feed.insertBefore(row, feed.firstChild);
      }
    }
  }
  function sendComment() {
    var nameInput = document.getElementById("username-input").value.trim();
    var txtInput = document.getElementById("comment-input").value.trim();
    if (!nameInput || !txtInput) return;
    var list = localStorage.getItem("bwc_comments") ? JSON.parse(localStorage.getItem("bwc_comments")) : [];
    list.push({ name: nameInput, text: txtInput });
    localStorage.setItem("bwc_comments", JSON.stringify(list));
    loadComments();
    document.getElementById("comment-input").value = "";
  }
  loadComments();
</script></body></html>
