<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Import a Pixel / Blocky font from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            background-color: #0b0f19; /* Dark background to make neon glow pop */
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Top-left Return Button */
        .top-left-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #121824;
            color: #39ff14; /* Neon Green */
            border: 4px solid #39ff14;
            padding: 12px 18px;
            text-decoration: none;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s ease;
        }

        .top-left-btn:hover {
            background-color: #39ff14;
            color: #000;
            box-shadow: 2px 2px 0px #000;
            transform: translate(2px, 2px);
        }

        /* Main Container */
        .container {
            max-width: 800px;
        }

        /* Giant Neon Block 404 */
        .error-code {
            font-size: 6rem;
            color: #ff007f; /* Neon Pink */
            text-shadow: 0 0 10px #ff007f, 0 0 30px #ff007f;
            margin-bottom: 30px;
            letter-spacing: -5px;
        }

        /* Subtext Message */
        .message {
            font-size: 1.1rem;
            line-height: 2;
            color: #00ffff; /* Neon Cyan */
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 50px;
            padding: 0 10px;
        }

        /* Main Bloxd Button */
        .bloxd-btn {
            display: inline-block;
            background-color: #121824;
            color: #ffff00; /* Neon Yellow */
            border: 6px solid #ffff00;
            padding: 20px 30px;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 6px 6px 0px #000;
            transition: all 0.1s ease;
        }

        .bloxd-btn:hover {
            background-color: #ffff00;
            color: #000;
            box-shadow: 3px 3px 0px #000;
            transform: translate(3px, 3px);
            text-shadow: none;
        }

        /* Responsive scaling for mobile devices */
        @media (max-width: 600px) {
            .error-code { font-size: 3.5rem; }
            .message { font-size: 0.75rem; line-height: 1.8; }
            .bloxd-btn { font-size: 0.7rem; padding: 15px 20px; }
            .top-left-btn { font-size: 0.55rem; padding: 8px 12px; top: 15px; left: 15px; }
        }
    </style>
</head>
<body>

    <!-- Top Left Corner Button -->
    <a href="/index.html" class="top-left-btn">< BACK</a>

    <!-- Center Content -->
    <div class="container">
        <h1 class="error-code">404</h1>
        <p class="message">We did not find that Page!</p>
        <a href="/index.html" class="bloxd-btn">Bloxd back to the main site</a>
    </div>

</body>
</html>
